name: Build and Publish

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
        arch: [amd64, arm64]
        include:
          - platform: linux
            arch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross_compile: false
          - platform: linux
            arch: arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross_compile: true
          - platform: windows
            arch: amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross_compile: false
          - platform: windows
            arch: arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            cross_compile: true
          - platform: macos
            arch: amd64
            os: macos-latest
            target: x86_64-apple-darwin
            cross_compile: false
          - platform: macos
            arch: arm64
            os: macos-latest
            target: aarch64-apple-darwin
            cross_compile: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: krakjn/bump@v9

      # x86_64 ld rejects rustc's aarch64-only --fix-cortex-a53-843419.
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'aarch64-linux-gnu-gcc' || '' }}
        run: |
          bump update Cargo.toml
          cargo build --release --target ${{ matrix.target }}

      - name: Clippy
        if: matrix.cross_compile == false && matrix.platform != 'windows'
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        if: matrix.cross_compile == false && matrix.platform != 'windows'
        run: cargo test

      # arc-<version>-<platform>-<arch>[.exe]
      - name: Prepare binary for upload
        id: prepare
        shell: bash
        run: |
          VERSION=$(bump print)
          STEM="arc-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          echo "STEM=$STEM" >> $GITHUB_OUTPUT
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp "target/${{ matrix.target }}/release/arc.exe" "${STEM}.exe"
          else
            cp "target/${{ matrix.target }}/release/arc" "$STEM"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.STEM }}
          path: ${{ steps.prepare.outputs.STEM }}*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p ./release
          find ./artifacts -name "arc-*" -type f -exec cp {} ./release/ \;
          ls -la ./release/

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            --generate-notes \
            ./release/*
          gh release upload ${{ github.ref_name }} ./release/*