name: Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN is not enough to trigger the tag run of build-and-publish.yml
          token: ${{ secrets.ARC_TOKEN }}

      - uses: krakjn/bump@v9

      - name: bump and tag
        env:
          # main tip before merge; diff to HEAD is what the PR landed
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bump patch --if-changed-from "$BASE"
          bump update Cargo.toml
          git add -u
          git diff --cached --quiet && exit 0
          git config user.name "arc-ci"
          git config user.email "arc-ci@users.noreply.github.com"
          git commit -m "chore: bump to $(bump print)"
          bump tag
          git push origin main --follow-tags
