name: Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: krakjn/bump@v9

      - name: bump and tag
        id: release
        env:
          # main tip before merge; diff to HEAD is what the PR landed
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bump patch --if-changed-from "$BASE"
          bump update Cargo.toml
          git add -u
          if git diff --cached --quiet; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "arc-ci"
          git config user.email "arc-ci@users.noreply.github.com"
          git commit -m "chore: bump to $(bump print)"
          bump tag
          TAG=$(git describe --tags --exact-match HEAD)
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git push origin main --follow-tags

      # GITHUB_TOKEN pushes do not start new workflow runs (including tag push).
      - name: Trigger release build
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ steps.release.outputs.tag }}"
