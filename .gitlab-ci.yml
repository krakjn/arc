workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_MESSAGE =~ /chore[:] bump to/ && $CI_COMMIT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true
  image: registry.gitlab.com/ballast-dev/arc

stages:
  - test
  - build
  - bump
  - release

variables:
  CARGO_TERM_COLOR: always

test:linux:
  stage: test
  script:
    - rustc --version
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test

build:linux-amd64:
  stage: build
  variables:
    ASSET: arc-linux-amd64
  script:
    - cargo build --release --target x86_64-unknown-linux-musl
    - cp target/x86_64-unknown-linux-musl/release/arc "${ASSET}"
    - chmod 755 "${ASSET}"
  artifacts:
    name: arc-linux-amd64
    expire_in: 30 days
    paths:
      - arc-linux-amd64

bump:
  stage: bump
  resource_group: bump
  interruptible: false
  needs:
    - test:linux
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache git
    - |
      set -euo pipefail
      git config user.email "${GITLAB_USER_EMAIL:-ci@${CI_SERVER_HOST}}"
      git config user.name "${GITLAB_USER_NAME:-gitlab-ci}"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      set -euo pipefail
      bump patch
      bump update Cargo.toml
      git add -u
      git commit -m "chore: bump to $(bump print)"
      bump tag
      git push origin "HEAD:${CI_DEFAULT_BRANCH}" --follow-tags

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  inherit:
    default: false
  needs:
    - job: build:linux-amd64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -euo pipefail
      glab release create "$CI_COMMIT_TAG" \
        --name "arc $CI_COMMIT_TAG" \
        --notes "Aggregate Repository Control $CI_COMMIT_TAG" \
        arc-linux-amd64
