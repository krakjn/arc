workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  image: registry.gitlab.com/ballast-dev/arc

stages:
  - test
  - build
  - bump
  - release

variables:
  CARGO_TERM_COLOR: always

test:linux:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_MESSAGE =~ /chore[:] bump to/
      when: never
    - if: $CI_COMMIT_BRANCH
  stage: test
  script:
    - rustc --version
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test

.build-linux-musl:
  image: rust:1.96-alpine
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache musl-dev
    - rustup target add "$TARGET"
  script:
    - cargo build --release --target "$TARGET"
    - cp "target/${TARGET}/release/arc" "${ASSET}"
    - chmod 755 "${ASSET}"
  artifacts:
    expire_in: 30 days

build:linux-amd64:
  extends: .build-linux-musl
  variables:
    TARGET: x86_64-unknown-linux-musl
    ASSET: arc-linux-amd64
  artifacts:
    expire_in: 30 days
    paths:
      - arc-linux-amd64

build:linux-arm64:
  extends: .build-linux-musl
  tags:
    - saas-linux-small-arm64
  variables:
    TARGET: aarch64-unknown-linux-musl
    ASSET: arc-linux-arm64
  artifacts:
    expire_in: 30 days
    paths:
      - arc-linux-arm64

bump:
  stage: bump
  resource_group: bump
  interruptible: false
  needs:
    - test:linux
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_MESSAGE =~ /chore[:] bump to/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache git
    - |
      set -euo pipefail
      : "${BALLAST_TOKEN:?set a masked BALLAST_TOKEN CI/CD variable; CI_JOB_TOKEN pushes do not create pipelines}"
      curl -fsSL https://raw.githubusercontent.com/krakjn/bump/main/install/get_bump.sh | sh
      git config user.email "${GITLAB_USER_EMAIL:-ci@${CI_SERVER_HOST}}"
      git config user.name "${GITLAB_USER_NAME:-gitlab-ci}"
      git remote set-url origin "https://oauth2:${BALLAST_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      set -euo pipefail
      bump patch
      bump update Cargo.toml
      VERSION="$(bump print)"
      git add -u
      git commit -m "chore: bump to ${VERSION}"
      bump tag
      # Job-token pushes land the commit/tag but never start a pipeline. A project
      # access token does. Skip CI on the bump commit so only the tag pipeline runs.
      git push origin "HEAD:${CI_DEFAULT_BRANCH}" -o ci.skip
      git push origin "${VERSION}"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  inherit:
    default: false
  needs:
    - job: build:linux-amd64
      artifacts: true
    - job: build:linux-arm64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -euo pipefail
      # Local files go through POST /uploads, which job tokens cannot call (401).
      # --use-package-registry uses the generic package API instead (installer path).
      glab release create "$CI_COMMIT_TAG" \
        --name "arc $CI_COMMIT_TAG" \
        --notes "Aggregate Repository Control $CI_COMMIT_TAG" \
        --use-package-registry \
        --package-name arc \
        arc-linux-amd64 \
        arc-linux-arm64
