[package]
name = "arc"
version = "0.3.12"
authors = ["tony"]
edition = "2024"
rust-version = "1.96"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
owo-colors = { version = "4.1", features = ["supports-colors"] }
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
