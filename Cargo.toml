[package]
name = "arc"
version = "0.4.0"
authors = ["tony"]
edition = "2024"
rust-version = "1.96"

# fast and loose deps, Cargo.lock will prevent breaks
[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
owo-colors = { version = "4", features = ["supports-colors"] }
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
