[package]
name = "arc"
version = "0.3.5"
authors = ["tony"]
edition = "2024"
rust-version = "1.96"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
regex = "1.11"
owo-colors = "4.1"
terminal_size = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
