[package]
name = "arc"
version = "0.3.5"
authors = ["tony"]
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
thiserror = "2.0"
once_cell = "1.20"
owo-colors = "4.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
